
# Application
spring.application.name=project-sleeper
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sleeper_db
spring.datasource.username=sleeper_user
spring.datasource.password=Sleeper@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
# Disabled temporarily while Hibernate manages the initial schema
spring.flyway.enabled=false
